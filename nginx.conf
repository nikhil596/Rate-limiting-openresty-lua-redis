worker_processes  auto;

# Set to `info` temporarily to see the per-request "rate_limit: IP=... COUNT=..."
# lines from the Lua script. Keep it at `warn` in steady-state production.
error_log         /usr/local/openresty/nginx/logs/error.log warn;
pid               /usr/local/openresty/nginx/logs/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # ============================================================
    # Real client IP
    #
    # Apache sits in front of OpenResty on this host, so every request
    # arrives from 127.0.0.1 and the real client is in X-Forwarded-For.
    #
    # set_real_ip_from lists the ONLY hops we trust. nginx walks the
    # X-Forwarded-For chain from the right, skipping trusted addresses,
    # and stops at the first untrusted one - that is the real client.
    # A client that sends its own X-Forwarded-For header cannot promote
    # itself past Apache's appended value, so it cannot mint a fresh
    # rate-limit bucket for itself.
    #
    # If another proxy or load balancer is ever added in front of Apache,
    # add its address here too, or the LB becomes the "client" and every
    # user shares one bucket.
    # ============================================================
    set_real_ip_from  127.0.0.1;
    real_ip_header    X-Forwarded-For;
    real_ip_recursive on;

    # $rl_count and $rl_key are populated by the Lua script
    log_format ratelimit '$remote_addr $remote_user [$time_local] '
                         'rl_key=$rl_key rl_count=$rl_count '
                         'status=$status "$request"';
    access_log /usr/local/openresty/nginx/logs/access.log ratelimit;

    sendfile           on;
    keepalive_timeout  65;

    # Backend Apache is assumed to be reachable at this address from
    # inside the container. On Linux with Docker 20.10+, host.docker.internal
    # resolves to the host machine when the extra_hosts entry in
    # docker-compose.yml is present. Adjust the port to match wherever
    # Apache is actually listening (e.g. :80 or :8443 for https backend).
    upstream backend {
        server x.x.x.x:9003;
        keepalive 32;
    }
    server {
        listen 127.0.0.1:8082;
        server_name localhost;

        # Declare the variables the Lua script writes to, so they resolve
        # in the log line even on requests the script never touches.
        set $rl_count "";
        set $rl_key   "";

        location ~ ^/api/something/[^/]+/usage(?:\?.*)?$ {
            access_by_lua_file /etc/openresty/lua/ratelimit.lua;

            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}